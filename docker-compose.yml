services:
  lumakeys:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumakeys
    restart: unless-stopped
    environment:
      PORT: 3001
      LUMAKEYS_DATA_DIR: /data
      # Required gate for /api/* (README section 5a). Put a long random token in a .env file
      # next to this file. The server refuses to start with this placeholder.
      LUMAKEYS_WEB_ACCESS_TOKEN: "${LUMAKEYS_WEB_ACCESS_TOKEN:-change-this-long-random-token}"
      # Only if Cloudflare Access protects the host and you want no token: delete the line
      # above and uncomment this one.
      # LUMAKEYS_TRUST_UPSTREAM_AUTH: "1"
    volumes:
      - /media/storage/lumakeys:/data
    ports:
      - "3001:3001"
